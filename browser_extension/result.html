<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Deepfake Analysis Result</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #1e1e2f; color: white; text-align: center; padding: 40px; }
        .container { max-width: 900px; margin: auto; background: #2a2a40; padding: 30px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        .original-img { max-width: 300px; max-height: 300px; border-radius: 8px; margin-bottom: 20px; border: 2px solid #444; }
        #loader { font-size: 20px; color: #ffcc00; margin: 40px 0; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid #007bff; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .verdict { font-size: 32px; font-weight: bold; margin-top: 10px; }
        .real { color: #00e676; }
        .fake { color: #ff3d00; }
        .heatmap-gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .heatmap-card { background: #1e1e2f; padding: 15px; border-radius: 8px; border: 1px solid #444; }
        .heatmap-card img { max-width: 250px; border-radius: 5px; }
        .error { color: #ff3d00; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 Deepfake Analysis Report</h1>

    <div id="mediaPreviewContainer"></div>

    <div id="loader">
        <div class="spinner"></div>
        <p>Connecting to AI and analyzing...</p>
    </div>

    <div id="resultBox" style="display:none;">
        <div id="verdictText" class="verdict"></div>
        <p style="color: #aaa;">Red/Yellow zones indicate manipulated pixels identified by the AI.</p>
        <div class="heatmap-gallery" id="gallery"></div>
    </div>
</div>

<script src="result.js"></script>
</body>
</html>
